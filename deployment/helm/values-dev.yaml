
replicaCount: 1

image:
  repository: dockerhub.ebi.ac.uk/gwas/gwas-mcp
  tag: dev
  pullPolicy: Always

service:
  name: gwas-mcp
  port: 80
  containerPort: 8000
  metricsPort: 9464

ingress:
  name: gwas-mcp
  annotations: {}
  path: "/gwas/api/mcp"
  mcpPath: "/gwas/api/mcp"

env:
  httpProxy: "http://hh-wwwcache.ebi.ac.uk:3128"

resources:
  limits:
    cpu: 1
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 128Mi