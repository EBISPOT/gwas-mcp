stages:
  - test
  - publish

default:
  before_script:
    - set -eu

.python:
  image: ghcr.io/astral-sh/uv:0.8.18-python3.13-bookworm-slim
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv

lint:
  extends: .python
  stage: test
  script:
    - uv run --with nox nox -s lint

tests:
  extends: .python
  stage: test
  script:
    - uv run --with nox nox -s tests

helm_checks:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/dtzar/helm-kubectl:4.2.2
  stage: test
  before_script:
    - set -eu
    - apk add --no-cache python3 py3-pip
    - pip install --break-system-packages uv==0.8.18
  script:
    - uv run --with nox nox -s helm

.docker-publish:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27.5.1-cli
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27.5.1-dind
      alias: docker
  stage: publish
  resource_group: gwas-mcp-release
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    GIT_DEPTH: "0"
  before_script:
    - set -eu
    - apk add --no-cache python3 py3-pip git
    - pip install --break-system-packages uv==0.8.18
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin dockerhub.ebi.ac.uk

publish_dev:
  extends: .docker-publish
  script:
    - uv run --with nox nox -s build_image -- "$CI_COMMIT_SHA" --dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"'

publish_release:
  extends: .docker-publish
  # Release tags must point at main; the release image is built from that tag.
  script:
    - uv run --with nox nox -s build_image -- "$CI_COMMIT_TAG" --promote
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && $CI_COMMIT_REF_PROTECTED == "true"'
